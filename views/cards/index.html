<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>卡片读取</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#242a35;--text:#e8ecf3;--muted:#8b95a7;
      --accent:#6ea8fe;--ok:#3fb950}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6ec;
      --text:#1a1d23;--muted:#6b7280;--accent:#2563eb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
h1{font-size:19px;margin:0;font-weight:650}.sub{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.stat .k{color:var(--muted);font-size:11.5px;margin-bottom:3px}
.stat .v{font-size:20px;font-weight:650}
h2{font-size:14px;margin:20px 0 10px;font-weight:620;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 15px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:9px;font-size:13px;flex-wrap:wrap}
.badge{font-size:11px;padding:1.5px 7px;border-radius:5px;background:rgba(110,168,254,.14);
       color:var(--accent);font-weight:600}
.badge.ok{background:rgba(63,185,80,.15);color:var(--ok)}
.url{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);
     word-break:break-all;margin-top:4px}
.muted{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}
button{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
       color:var(--text);cursor:pointer;font-size:13.5px}button:hover{border-color:var(--accent)}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:22px}
</style></head><body><div class="wrap">
<header><h1>卡片读取</h1><span class="sub" id="conn">连接中…</span></header>
<div class="grid" id="stats"></div>
<h2>最近解析的卡片</h2><div id="records"><div class="empty">还没有解析记录</div></div>
<div style="margin-top:16px"><button id="refresh">刷新</button></div>
<div class="foot">卡片只会注入给模型看，不会把「标题：…链接：…」发给你。</div>
</div><script type="module">
const PLUGIN_ID="astrbot_plugin_card_reader";
const bridge=window.AstrBotPluginView||window.AstrBotPluginPage;
const el=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function apiGet(ep){const p=await bridge.apiGet(`${PLUGIN_ID}/${ep}`);if(p&&p.ok===false)throw new Error(p.error);return p&&Object.prototype.hasOwnProperty.call(p,"data")?p.data:p;}
function render(d){
  el("stats").innerHTML=`
    <div class="stat"><div class="k">状态</div><div class="v">${d.enabled?"开启":"关闭"}</div></div>
    <div class="stat"><div class="k">拦截旧回显</div><div class="v">${d.suppress_legacy_echo?"开":"关"}</div></div>
    <div class="stat"><div class="k">每轮上限</div><div class="v">${d.max_cards_per_turn}</div></div>
    <div class="stat"><div class="k">累计解析</div><div class="v">${d.total??0}</div></div>`;
  const rs=d.records||[];
  el("records").innerHTML=rs.length?rs.map(r=>`
    <div class="card"><div class="row">
      <span class="badge">${esc(r.kind||"?")}</span>
      <span class="muted">${esc(r.ts||"")}</span>
      ${r.injected?'<span class="badge ok">已注入</span>':""}
    </div>
    <div style="font-size:13px;margin-top:4px">${esc(r.title||"(无标题)")}</div>
    <div class="url">${esc(r.url||"")}</div></div>`).join(""):`<div class="empty">还没有解析记录</div>`;
}
async function load(){try{el("conn").textContent="已连接";render(await apiGet("overview"));}catch(e){el("conn").textContent="连接失败";}}
async function boot(){if(!bridge){el("conn").textContent="bridge 未加载";return;}
 await bridge.ready();await load();el("refresh").onclick=load;setInterval(load,20000);}
boot();
</script></body></html>
